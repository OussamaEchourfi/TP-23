spring:
  application:
    name: SERVICE-CAR
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      config:
        enabled: ${CONSUL_CONFIG_ENABLED:true}
        format: yaml
        prefixes:
          - consul/config
        default-context: service-car
        profile-separator: ':'
        data-key: data
        fail-fast: false
